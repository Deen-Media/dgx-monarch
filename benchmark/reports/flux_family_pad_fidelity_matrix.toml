unet = "flux1-dev.safetensors"
te = { name = ["clip_l.safetensors", "t5xxl_fp16.safetensors"], type = "flux" }
topology = "dp2"
batch = 2
width = 1024
height = 1024
prompt = "A wide documentary photograph of a working lighthouse on a rocky headland at golden hour. The tower is whitewashed stone with a black iron gallery and a glass lantern room, and the low sun throws a long shadow across wet granite slabs. Seabirds circle above the spray. A narrow gravel path runs from the keeper cottage to the tower door, edged by rough grass bent flat by the wind. In the distance a fishing boat crosses a heavy swell under a bank of dramatic clouds lit from below. The water is dark green and streaked with foam, and the horizon line sits just above the middle of the frame. The cottage roof is slate, patched near the chimney, and a coil of blue rope hangs on a nail beside the door. Two lobster creels lean against the wall, their netting frayed and salt stained. Beyond the wall the ground falls away in ledges of grey rock, cut by narrow channels where the tide runs back out. Lichen the colour of mustard covers the highest stones, and the lower ones are black and slick. A weather vane on the cottage gable points inland. The light picks out every joint in the tower masonry and every rivet in the gallery rail. Amateur photography, unfiltered, real life, natural light, subtle shadows, fine grain, sharp detail in the stonework and soft detail in the moving water."

[[case]]
name = "ref-flux-1024-long-even"
unet = "flux1-dev.safetensors"
te = { name = ["clip_l.safetensors", "t5xxl_fp16.safetensors"], type = "flux" }
topology = "dp2"
batch = 2
width = 1024
