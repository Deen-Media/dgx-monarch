prompt = "A wide documentary photograph of a working lighthouse on a rocky headland at golden hour. The tower is whitewashed stone with a black iron gallery and a glass lantern room, and the low sun throws a long shadow across wet granite slabs. Seabirds circle above the spray. A narrow gravel path runs from the keeper cottage to the tower door, edged by rough grass bent flat by the wind. In the distance a fishing boat crosses a heavy swell under a bank of dramatic clouds lit from below. The water is dark green and streaked with foam, and the horizon line sits just above the middle of the frame. The cottage roof is slate, patched near the chimney, and a coil of blue rope hangs on a nail beside the door. Two lobster creels lean against the wall, their netting frayed and salt stained. Beyond the wall the ground falls away in ledges of grey rock, cut by narrow channels where the tide runs back out. Lichen the colour of mustard covers the highest stones, and the lower ones are black and slick. A weather vane on the cottage gable points inland. The light picks out every joint in the tower masonry and every rivet in the gallery rail. Amateur photography, unfiltered, real life, natural light, subtle shadows, fine grain, sharp detail in the stonework and soft detail in the moving water. Wide angle."

# Leg 1: the odd image stream, 8281 rows. This is the cell the divisibility
# refusal turned away, and the same 1448 canvas krea2's own pad matrix uses.
[[case]]
name = "gate-flux-1448-odd-image"
unet = "flux1-dev.safetensors"
te = { name = ["clip_l.safetensors", "t5xxl_fp16.safetensors"], type = "flux" }
topology = "uly2"
reference = "ref-flux-1448"
width = 1448
height = 1448
prompt = "a lighthouse on a rocky coast at golden hour, dramatic clouds, oil painting"

# Leg 2: the divisible companion for leg 1. Nothing pads, so the kernel call is
# the one an unpadded render already made, and this number is the band leg 1 is
# read against.
[[case]]
name = "gate-flux-1024-even"
unet = "flux1-dev.safetensors"
te = { name = ["clip_l.safetensors", "t5xxl_fp16.safetensors"], type = "flux" }
topology = "uly2"
reference = "ref-flux-1024"
width = 1024
height = 1024
prompt = "a lighthouse on a rocky coast at golden hour, dramatic clouds, oil painting"

# Leg 3: the odd text stream, 313 rows, on an even image. The double loop's pad
# then sits inside a text slice rather than at the tail of the rank's block,
# which is the coordinate the drop set has to get right.
[[case]]
name = "gate-flux-1024-odd-text"
unet = "flux1-dev.safetensors"
te = { name = ["clip_l.safetensors", "t5xxl_fp16.safetensors"], type = "flux" }
topology = "uly2"
reference = "ref-flux-1024-long"
width = 1024
height = 1024
