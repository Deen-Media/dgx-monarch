# Flux, Flux2 and LongCat pad-row exclusion fidelity (2026-09-09). This is the
# probe that FluxAdapter.usp_pad_exclusion_probe names, and Flux2Adapter and
# LongCatAdapter inherit that attribute. Run it with:
#   <comfy python> benchmark/run_matrix.py --matrix benchmark/reports/flux_family_pad_fidelity_matrix.toml
#
# References are dp2 batch = 2 slice 0, which carries exact single-GPU math on
# the two-worker mesh; candidates are uly2 at one step under gate_step_fidelity
# (DEFAULT_STEP_NRMS 0.10). Every padded leg has a divisible companion on the
# same checkpoint, the same day and the same reference kind. The 2026-09 chroma
# cfg2 diagnosis measured a family's own bf16 sensitivity at about 0.03 on a
# leg that runs no adapter code, so a number carried across builds cannot be
# the criterion: a padded leg is read against its companion's band. Record
# both numbers in the report.
#
# Which stream pads, and why it is the image one.
# The three families take their text at a floor, so an ordinary prompt reaches
# the model at a length that already divides two:
#   flux      T5XXL min_length 256 (comfy/text_encoders/flux.py)
#   flux2     comfy front-pads every text cond to 512 (model_base.Flux2)
#   longcat   the tokenizer truncates and pads to exactly 512, always
# So the padded path these legs exercise is the image stream, whose row count
# is arithmetic on the canvas rather than a token count anybody has to guess:
#   flux and longcat   latent = px / 8, patch 2, rows = ((latent + 1) // 2) ^ 2
#                      1024 -> 64 x 64 = 4096 even; 1448 -> 91 x 91 = 8281 odd
#   flux2              latent = px / 16, patch 1, rows = latent ^ 2
#                      1024 -> 64 x 64 = 4096 even; 1040 -> 65 x 65 = 4225 odd
# A text pad needs a prompt past the floor. One leg carries it on flux: the
# long positive below counts 313 rows and its companion 316, on comfy's own
# FluxTokenizer and on the sweep reader alike (both counted on 2026-09-09
# against the tokenizer ComfyUI ships). LongCat can never pad its text, and
# flux2 would need a prompt past 512 rows to.
#
# Both block loops pad on every gate leg here. The double loop shards text and
# image apart and names the two pad sets in [text, image] order; the single loop
# shards the re-joined stream and names one tail. The joint totals:
#   flux 1448 short prompt    256 + 8281 = 8537 odd
#   flux 1024 long prompt     313 + 4096 = 4409 odd
#   flux2 1040                512 + 4225 = 4737 odd
#   longcat 1448              512 + 8281 = 8793 odd
# and every companion total is even.
#
# The route. run_matrix.py offers two sampling routes and this file runs the
# ksampler one for all three families, including flux2, whose shipped graph uses
# the Flux2Scheduler custom sampler instead. One route for three families keeps
# the numbers readable side by side, and the cfg_pp sampler evaluates the uncond
# leg at cfg 1.0, so each render exercises its negative stream as well. The
# ksampler route sets no guidance on the conditioning, so every leg here runs at
# the stock 3.5 the model's extra_conds falls back to.
#
# The sanity check. The divisible-stream uly2 readings in the per-model
# evidence of docs/VALIDATION.md are what each companion re-reads: flux 1 dev
# 0.008, flux 1 schnell 0.048, flux2 0.017 (this run; 0.016 on the 2026-08-21
# build), longcat 0.097.
#
# The result, 2026-09-09. Run on the pair in cluster mode with the driver
# stopped, 1-step NRMS against each leg's own dp2 reference:
#   gate-flux-1448-odd-image     0.006    gate-flux-1024-even       0.006
#   gate-flux-1024-odd-text      0.005    gate-flux-1024-even-text  0.005
#   gate-longcat-1448-odd-image  0.008    gate-longcat-1024-even    0.009
#   gate-flux2-1040-odd-image    0.019    gate-flux2-1024-even      0.017
# Every gate passed: each padded case was within its control's band. The
# 20-step render is for visual inspection only. Flux 1 Schnell has no leg
# here, so a padded render on that checkpoint stays unmeasured. On 2026-10-06,
# with stock key order restored in the double blocks, all eight scored legs
# read 0.0, identical to their dp2 references (docs/VALIDATION.md, flux-family
# key order record).

[defaults]
steps = 1
cfg = 1.0
sampler = "euler_cfg_pp"
scheduler = "simple"
seed = 42
repeats = 1
negative = "low quality, blurry, watermark, oversaturated colors, deformed anatomy"

[[case]]
name = "ref-flux-1448"
unet = "flux1-dev.safetensors"
te = { name = ["clip_l.safetensors", "t5xxl_fp16.safetensors"], type = "flux" }
topology = "dp2"
batch = 2
width = 1448
height = 1448
prompt = "a lighthouse on a rocky coast at golden hour, dramatic clouds, oil painting"

[[case]]
name = "ref-flux-1024"
unet = "flux1-dev.safetensors"
te = { name = ["clip_l.safetensors", "t5xxl_fp16.safetensors"], type = "flux" }
