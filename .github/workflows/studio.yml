name: Studio contracts and bundled assets

on:
  push:
    branches: [dev]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Type, accessibility and contract checks
        working-directory: studio
        run: |
          npm ci
          npm run check
          npm test
          npm run build
      - name: Checked-in asset reproducibility
        run: git diff --exit-code -- src/dgx_monarch/studio/static
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Inventory matches source
        run: PYTHONPATH=src python tools/gen_studio_inventory.py --check
